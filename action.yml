name: 'Create Semantic Release'
description: 'Automatically create semantic versioned releases with release notes'
author: 'KubeScript'
branding:
  icon: 'tag'
  color: 'blue'

inputs:
  bump-type:
    description: 'Version bump type (major, minor, patch, premajor, preminor, prepatch, prerelease). Ignored when `version` is set.'
    required: false
    default: ''
  version:
    description: 'Explicit version without prefix (e.g. 1.2.3). When set, overrides `bump-type` and the tag becomes `{prefix}{version}`.'
    required: false
    default: ''
  prefix:
    description: 'Tag prefix (e.g., v, app-v, service-). Leave empty to use `version` verbatim as the tag.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for creating releases (use secrets.GITHUB_TOKEN)'
    required: true

outputs:
  release-tag:
    description: 'Created release tag (with prefix)'
    value: ${{ inputs.prefix }}${{ steps.resolved.outputs.version }}
  release-version:
    description: 'Version number without prefix'
    value: ${{ steps.resolved.outputs.version }}
  release-url:
    description: 'URL of the created release'
    value: ${{ steps.create-release.outputs.html_url }}

runs:
  using: 'composite'
  steps:
    - name: Fetch all tags
      shell: bash
      run: git fetch --tags --force

    - name: Generate next version (auto-bump)
      id: auto-version
      if: inputs.version == ''
      uses: zwaldowski/semver-release-action@v6
      with:
        bump: ${{ inputs.bump-type }}
        prefix: ${{ inputs.prefix }}
        github_token: ${{ inputs.github-token }}
        dry_run: true

    - name: Resolve version
      id: resolved
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ steps.auto-version.outputs.version }}" ]; then
          echo "version=${{ steps.auto-version.outputs.version }}" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Either 'version' or 'bump-type' must be provided"
          exit 1
        fi

    - name: Get current commit SHA
      id: commit-sha
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create-release
      uses: ncipollo/release-action@v1
      with:
        generateReleaseNotes: true
        name: ${{ inputs.prefix }}${{ steps.resolved.outputs.version }}
        tag: ${{ inputs.prefix }}${{ steps.resolved.outputs.version }}
        commit: ${{ steps.commit-sha.outputs.sha }}
        token: ${{ inputs.github-token }}
